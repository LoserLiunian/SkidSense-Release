name: publish-mobile

# The phone app (mobile/ in the source), a release or a beta, started by
# hand and shipped on its own: the desktop ships from publish-desktop.yml,
# and neither waits for the other or touches the other's files.
#
# Its own tag, `mobile-v<version>`, in the source and here: a release of its
# own beside the desktop's `v<version>` ones, so the two apps can ship the
# same version number at different times, and a phone's release never lands
# where the desktop's updater looks. That is also why it is never the
# repository's latest: `releases/latest` stays the desktop's download page,
# which the README links and electron-updater's GitHub provider reads. A
# phone's own updater reads only mobile.release.json / mobile.beta.json,
# committed here, and accepts a file only from under this version's tag.
#
# The channel is picked at launch and must agree with the version typed, as
# the desktop's: a release refuses a pre-release version and writes
# mobile.release.json; a beta must be `-beta.N` (N from 1 to 98, which the
# Android versionCode carries), is a pre-release, and writes mobile.beta.json.
# The version is written into package.json, as the desktop's is — one version
# line, read by Gradle (mobile/build-logic's SkidVersion) — and the commit
# tagged, so every file is built from one commit.
#
# What it builds: the tests (JVM and the iOS simulator), one R8 release APK
# cut per ABI and signed apart from every build (android-sign), an unsigned
# IPA. It runs here, in public, for the reasons publish-desktop.yml gives: the
# source is reached with SOURCE_DEPLOY_KEY, kept in git's config only by
# prepare (which runs nothing from the source), and whatever a build prints
# goes to BUILD_LOG, sealed onto the draft with BUILD_LOG_KEY when it fails —
# in the source repository, `node scripts/build-log.mjs read mobile-v<version>`
# opens it.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: '渠道：beta（测试版）或 release（正式版）'
        required: true
        type: choice
        options:
          - beta
          - release
      version:
        description: '版本号，不要带 v（正式版如 1.2.0，测试版如 1.2.0-beta.1）'
        required: true
        type: string
      notes:
        description: '更新说明，支持多行 Markdown'
        required: true
        type: string

env:
  RELEASE_REPO: LoserLiunian/SkidSense-Release
  SOURCE_REPO: LoserLiunian/SkidSense
  CHANNEL: ${{ inputs.channel }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    # One push to the source's main at a time, whichever app's run it is
    # (publish-desktop's prepare commits package.json too).
    concurrency:
      group: source-version-push
      cancel-in-progress: false
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      code: ${{ steps.version.outputs.code }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      # The one checkout that keeps the deploy key: this job pushes.
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.SOURCE_REPO }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}

      - name: Check the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="$(printf '%s' "$INPUT_VERSION" | tr -d '[:space:]' | sed 's/^v//')"
          # Numbered for Android as mobile/'s AppVersion does: major ×
          # 1,000,000 + minor × 10,000 + patch × 100 + (beta n, or 99). So
          # minor and patch stay under 100 and a beta is `-beta.N` with N
          # from 1 to 98, or two versions would share a number.
          if [ "$CHANNEL" = release ]; then
            case "$version" in
              *-*) echo "这个版本号是预发布（$version），渠道请选 beta"; exit 1 ;;
            esac
            printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || {
              echo "版本号必须形如 1.2.0，收到的是「$version」"; exit 1
            }
            beta=99
          else
            case "$version" in
              *-*) ;;
              *) echo "beta 的版本号必须带后缀（例如 1.2.0-beta.1），收到的是「$version」；正式版渠道请选 release"; exit 1 ;;
            esac
            printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$' || {
              echo "beta 的版本号必须形如 1.2.0-beta.1（手机端按 beta 序号排版本），收到的是「$version」"; exit 1
            }
            beta="${version##*-beta.}"
            [ "$((10#$beta))" -ge 1 ] && [ "$((10#$beta))" -le 98 ] || {
              echo "beta 序号要在 1 到 98 之间，收到的是「$version」"; exit 1
            }
          fi
          IFS=. read -r major minor patch <<< "${version%%-*}"
          [ "$((10#$minor))" -lt 100 ] && [ "$((10#$patch))" -lt 100 ] || {
            echo "次版本号和修订号都要小于 100（手机端的 versionCode 放不下），收到的是「$version」"; exit 1
          }
          code=$(( 10#$major * 1000000 + 10#$minor * 10000 + 10#$patch * 100 + 10#$beta ))
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=mobile-v$version" >> "$GITHUB_OUTPUT"
          echo "版本：$version（$CHANNEL，versionCode $code）"

      - name: Write the version into package.json
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node -e '
            const fs = require("node:fs")
            const file = "package.json"
            const pkg = JSON.parse(fs.readFileSync(file, "utf8"))
            pkg.version = process.env.VERSION
            fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + "\n")
          '
          git diff --stat

      - name: Commit, tag and push
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          # Nothing to commit when main already says this version: a rerun,
          # or the desktop's release of the same version.
          if git diff --cached --quiet; then
            echo "package.json 已经是 $VERSION，无需提交"
          elif [ "$CHANNEL" = beta ]; then
            git commit -m "release: $VERSION (mobile beta)"
          else
            git commit -m "release: $VERSION (mobile)"
          fi

          # As the desktop's tag (see publish-desktop.yml): asked of the
          # remote, since checkout fetches with `--no-tags`; reused when it
          # is on this commit; moved only while nothing was ever uploaded to
          # its release, since a version that shipped files is spent.
          remote_tag="$(git ls-remote --tags origin "refs/tags/$TAG" | cut -f1)"
          if [ -z "$remote_tag" ]; then
            git tag "$TAG"
          elif [ "$remote_tag" = "$(git rev-parse HEAD)" ]; then
            echo "tag $TAG 已存在于远端且就在这个提交上，沿用"
          elif [ "$(gh release view "$TAG" -R "$RELEASE_REPO" --json assets -q '.assets | length' 2>/dev/null || echo 0)" = "0" ]; then
            echo "tag $TAG 指向别的提交，但没有发布过任何产物，改指到当前提交"
            git tag -f "$TAG"
            git push --force origin "refs/tags/$TAG"
          else
            echo "tag $TAG 已存在，且那个版本已经发布过产物，换一个版本号"; exit 1
          fi

          # `actions/checkout` leaves a detached HEAD: the destination has to
          # be named.
          git push origin "HEAD:main" "refs/tags/$TAG"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          NOTES: ${{ inputs.notes }}
        run: |
          printf '%s\n' "$NOTES" > notes.md
          # A re-run finds the release its failed attempt left behind, maybe
          # already published: back to draft, and published again at the end.
          if gh release view "$TAG" -R "$RELEASE_REPO" >/dev/null 2>&1; then
            echo "release $TAG 已存在，更新说明并回到 draft"
            gh release edit "$TAG" -R "$RELEASE_REPO" --notes-file notes.md --draft
            exit 0
          fi
          # A draft until the last step, so a failed build leaves nothing for
          # anyone to download; a beta is a pre-release from the start.
          if [ "$CHANNEL" = beta ]; then
            gh release create "$TAG" -R "$RELEASE_REPO" --draft --prerelease \
              --title "SkidSense 手机版 $VERSION（beta）" --notes-file notes.md
          else
            gh release create "$TAG" -R "$RELEASE_REPO" --draft \
              --title "SkidSense 手机版 $VERSION" --notes-file notes.md
          fi

  # The tests, on the JVM and compiled by Kotlin/Native on the simulator. A
  # phone is shipped only once both pass: android-sign and ios wait for them.
  test:
    name: test (${{ matrix.name }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      BUILD_LOG: build-output.log
      TAG: ${{ needs.prepare.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # core and the platform services on the JVM, and the publish tool.
          - name: jvm
            os: ubuntu-latest
          # The same tests compiled by Kotlin/Native, on the simulator.
          - name: ios
            os: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.SOURCE_REPO }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      # Gradle's downloads, and on macOS Kotlin/Native's toolchain (~/.konan),
      # most of a cold iOS build.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: mobile-${{ runner.os }}-${{ hashFiles('mobile/gradle/libs.versions.toml', 'mobile/**/*.gradle.kts', 'mobile/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: mobile-${{ runner.os }}-

      - name: Test
        working-directory: mobile
        run: |
          [ -z "$ANDROID_HOME" ] || echo "sdk.dir=$ANDROID_HOME" > local.properties
          if [ "${{ matrix.name }}" = "jvm" ]; then
            tasks=":core:jvmTest :platform:jvmTest :tools:publish:test"
          else
            tasks=":core:iosSimulatorArm64Test :platform:iosSimulatorArm64Test"
          fi
          ./gradlew --no-daemon $tasks >> "$GITHUB_WORKSPACE/$BUILD_LOG" 2>&1
          echo "测试通过；输出 $(wc -l < "$GITHUB_WORKSPACE/$BUILD_LOG") 行，不在公开日志里"

      - name: Seal the build output onto the release
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_LOG_KEY: ${{ secrets.BUILD_LOG_KEY }}
        run: |
          [ -s "$BUILD_LOG" ] || { echo "失败在构建之前，原因就在上面的日志里"; exit 0; }
          sealed="buildlog-${{ github.run_id }}-${{ github.run_attempt }}-test-${{ matrix.name }}.sealed"
          node scripts/build-log.mjs seal "$BUILD_LOG" "$sealed"
          gh release upload "$TAG" "$sealed" -R "$RELEASE_REPO" --clobber
          echo "构建输出已加密，挂在 $TAG 上：$sealed"
          echo "在源码仓库里读：node scripts/build-log.mjs read $TAG"

  # One release build with every ABI, R8 in full, left unsigned: the release
  # key never meets a build (android-sign signs it). The APK reaches
  # android-sign through the draft as a hand-off file, which comes off at the
  # end; R8's mapping, which reads a crash's stack, stays on the release
  # sealed with BUILD_LOG_KEY (`node scripts/build-log.mjs open`).
  android:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      BUILD_LOG: build-output.log
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.SOURCE_REPO }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: mobile-android-${{ hashFiles('mobile/gradle/libs.versions.toml', 'mobile/**/*.gradle.kts', 'mobile/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: mobile-android-

      - name: Build the APK
        working-directory: mobile
        env:
          BUILD_LOG_KEY: ${{ secrets.BUILD_LOG_KEY }}
          # The repackaging guard's pin (BuildFlags.signingSha256): the
          # release certificate's SHA-256, public — it rides in every APK —
          # so a repository variable, not a secret. Unset, the guard is off.
          SKIDSENSE_SIGNING_SHA256: ${{ vars.ANDROID_SIGNING_SHA256 }}
        run: |
          log="$GITHUB_WORKSPACE/$BUILD_LOG"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew --no-daemon :androidApp:assembleRelease >> "$log" 2>&1
          apk=androidApp/build/outputs/apk/release/androidApp-release-unsigned.apk
          mapping=androidApp/build/outputs/mapping/release/mapping.txt
          [ -f "$apk" ] && [ -f "$mapping" ] || { echo "没有构建出 APK 或 R8 的 mapping"; exit 1; }
          mkdir -p "$RUNNER_TEMP/out"
          cp "$apk" "$RUNNER_TEMP/out/handoff-${{ github.run_id }}-android-unsigned.apk"
          node ../scripts/build-log.mjs seal "$mapping" "$RUNNER_TEMP/out/SkidSense-$VERSION-android-mapping.sealed"
          echo "构建完成：$(du -h "$apk" | cut -f1)；输出 $(wc -l < "$log") 行，不在公开日志里"

      - name: Hand the APK to android-sign
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$RUNNER_TEMP"/out/* -R "$RELEASE_REPO" --clobber

      - name: Seal the build output onto the release
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_LOG_KEY: ${{ secrets.BUILD_LOG_KEY }}
        run: |
          [ -s "$BUILD_LOG" ] || { echo "失败在构建之前，原因就在上面的日志里"; exit 0; }
          sealed="buildlog-${{ github.run_id }}-${{ github.run_attempt }}-android.sealed"
          node scripts/build-log.mjs seal "$BUILD_LOG" "$sealed"
          gh release upload "$TAG" "$sealed" -R "$RELEASE_REPO" --clobber
          echo "构建输出已加密，挂在 $TAG 上：$sealed"

  # One APK per ABI cut from the universal one (its other ABIs' libraries
  # left out) and the universal one itself, each aligned for 16 KB pages and
  # signed v2 with the release key — the Flutter app's, so this installs over
  # it — then checked against the certificate, the version and the alignment
  # before anything is uploaded. One build, one versionCode for all four.
  # The key is in the `android-signing` environment, and this job checks out
  # nothing and builds nothing: no code from the source runs beside it.
  android-sign:
    needs: [prepare, android, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: android-signing
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      CODE: ${{ needs.prepare.outputs.code }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: Fetch the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" -R "$RELEASE_REPO" -p "handoff-${{ github.run_id }}-android-unsigned.apk" -D "$RUNNER_TEMP/in"
          ls -la "$RUNNER_TEMP/in"

      - name: Restore the signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          [ -n "$KEYSTORE" ] || { echo "缺少 ANDROID_KEYSTORE_BASE64 secret（android-signing 环境）"; exit 1; }
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Cut it per ABI and sign
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          unsigned="$RUNNER_TEMP/in/handoff-${{ github.run_id }}-android-unsigned.apk"
          mkdir -p "$RUNNER_TEMP/out"
          for pair in universal:all arm64:arm64-v8a arm:armeabi-v7a x64:x86_64; do
            token="${pair%%:*}"
            abi="${pair#*:}"
            python3 - "$unsigned" "$RUNNER_TEMP/$token.apk" "$abi" <<'EOF'
          import sys, zipfile
          source, target, abi = sys.argv[1:]
          with zipfile.ZipFile(source) as apk, zipfile.ZipFile(target, 'w') as out:
              for entry in apk.infolist():
                  if abi != 'all' and entry.filename.startswith('lib/') and not entry.filename.startswith(f'lib/{abi}/'):
                      continue
                  copy = zipfile.ZipInfo(entry.filename, date_time=entry.date_time)
                  copy.compress_type = entry.compress_type
                  copy.external_attr = entry.external_attr
                  out.writestr(copy, apk.read(entry))
          EOF
            "$tools/zipalign" -P 16 -f 4 "$RUNNER_TEMP/$token.apk" "$RUNNER_TEMP/$token-aligned.apk"
            "$tools/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD \
              --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled false --v4-signing-enabled false \
              --out "$RUNNER_TEMP/out/SkidSense-$VERSION-android-$token.apk" "$RUNNER_TEMP/$token-aligned.apk"
          done
          rm -f "$RUNNER_TEMP/release.jks"
          ls -la "$RUNNER_TEMP/out"

      # Signed with the release key, numbered as the version says, and
      # aligned — or nothing is uploaded. An APK signed otherwise would never
      # install over a copy already there; one numbered lower would be
      # refused as a downgrade; one misaligned would not install on a phone
      # with 16 KB pages.
      - name: Verify the APKs
        env:
          EXPECTED: ${{ secrets.ANDROID_CERT_SHA256 }}
        run: |
          [ -n "$EXPECTED" ] || { echo "缺少 ANDROID_CERT_SHA256 secret（android-signing 环境）"; exit 1; }
          tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          for apk in "$RUNNER_TEMP"/out/*.apk; do
            # Every signer's certificate, whatever apksigner calls them
            # ("Signer #1 certificate …" until 36, "V2 Signer: certificate …"
            # from 37): one, the release key's.
            digest="$("$tools/apksigner" verify --print-certs "$apk" | sed -n -E 's/.*certificate SHA-256 digest: ([0-9a-f]{64})$/\1/p' | sort -u)"
            [ "$digest" = "$EXPECTED" ] || { echo "$apk 的签名不是发布密钥（${digest}）"; exit 1; }
            badging="$("$tools/aapt2" dump badging "$apk" | head -1)"
            echo "$badging" | grep -q "versionCode='$CODE'" || { echo "$apk 的 versionCode 不是 ${CODE}：$badging"; exit 1; }
            echo "$badging" | grep -q "versionName='$VERSION'" || { echo "$apk 的 versionName 不是 ${VERSION}：$badging"; exit 1; }
            "$tools/zipalign" -c -P 16 4 "$apk" || { echo "$apk 没有按 16 KB 对齐"; exit 1; }
            echo "✓ $(basename "$apk")"
          done

      - name: Upload to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$RUNNER_TEMP"/out/*.apk -R "$RELEASE_REPO" --clobber

  # The iPhone app, archived for a device without signing and packed as an
  # IPA (Payload/SkidSense.app, zipped) for a person to sign and sideload:
  # there is no paid developer account behind it, so no App Store and no
  # in-app update. Its dSYMs stay on the release sealed, as the mapping does.
  ios:
    needs: [prepare, test]
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      BUILD_LOG: build-output.log
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.SOURCE_REPO }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: mobile-${{ runner.os }}-${{ hashFiles('mobile/gradle/libs.versions.toml', 'mobile/**/*.gradle.kts', 'mobile/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: mobile-${{ runner.os }}-

      # The Xcode project is generated (XcodeGen), never committed; its
      # pre-generate command writes the version Gradle reads from package.json.
      - name: Archive and pack the IPA
        working-directory: mobile
        env:
          BUILD_LOG_KEY: ${{ secrets.BUILD_LOG_KEY }}
        run: |
          log="$GITHUB_WORKSPACE/$BUILD_LOG"
          brew install xcodegen >> "$log" 2>&1
          cd iosApp
          xcodegen >> "$log" 2>&1
          out="$RUNNER_TEMP/ios"
          xcodebuild archive -project SkidSense.xcodeproj -scheme SkidSense -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -archivePath "$out/SkidSense.xcarchive" -derivedDataPath "$out/derived" \
            CODE_SIGNING_ALLOWED=NO >> "$log" 2>&1
          app="$out/SkidSense.xcarchive/Products/Applications/SkidSense.app"
          [ -d "$app" ] || { echo "没有归档出 SkidSense.app"; exit 1; }
          name="$(/usr/libexec/PlistBuddy -c "Print :SkidSenseVersionName" "$app/Info.plist")"
          [ "$name" = "$VERSION" ] || { echo "IPA 的版本是「$name」，本应是 $VERSION"; exit 1; }
          mkdir -p "$out/ipa/Payload" "$out/release"
          cp -R "$app" "$out/ipa/Payload/"
          (cd "$out/ipa" && zip -qry "$out/release/SkidSense-$VERSION-ios.ipa" Payload)
          if [ -d "$out/SkidSense.xcarchive/dSYMs" ]; then
            tar -cf "$out/dsyms.tar" -C "$out/SkidSense.xcarchive" dSYMs
            node "$GITHUB_WORKSPACE/scripts/build-log.mjs" seal "$out/dsyms.tar" "$out/release/SkidSense-$VERSION-ios-dsym.sealed"
          else
            echo "::warning::归档里没有 dSYM"
          fi
          echo "完成：IPA $(du -h "$out/release/SkidSense-$VERSION-ios.ipa" | cut -f1)；输出 $(wc -l < "$log") 行，不在公开日志里"

      - name: Upload to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$RUNNER_TEMP"/ios/release/* -R "$RELEASE_REPO" --clobber

      - name: Seal the build output onto the release
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_LOG_KEY: ${{ secrets.BUILD_LOG_KEY }}
        run: |
          [ -s "$BUILD_LOG" ] || { echo "失败在构建之前，原因就在上面的日志里"; exit 0; }
          sealed="buildlog-${{ github.run_id }}-${{ github.run_attempt }}-ios.sealed"
          node scripts/build-log.mjs seal "$BUILD_LOG" "$sealed"
          gh release upload "$TAG" "$sealed" -R "$RELEASE_REPO" --clobber
          echo "构建输出已加密，挂在 $TAG 上：$sealed"

  # The phone's index, committed here before the release is published, then
  # the release. Only once Android is signed: the index lists its APKs, and a
  # phone is never offered files that are not there. An iPhone build that
  # failed does not hold Android back (it has no in-app update); the run says
  # it is missing, and re-running the failed job adds the IPA and runs this
  # again.
  publish:
    # `needs` lists every job whose outputs are read, not only the direct
    # dependency: an output of a job not named resolves to an empty string.
    needs: [prepare, test, android, android-sign, ios]
    if: ${{ !cancelled() && needs.android-sign.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      # For the publish tool (mobile/tools/publish), built from the tagged
      # commit. Nothing is pushed from here, so the key does not stay.
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.SOURCE_REPO }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      # Written by the source's own tool through the classes the app reads
      # it with, from the APKs android-sign put on the release: an index the
      # app would refuse is not written, and every link points under this
      # version's tag.
      - name: Write the phone's index
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
        run: |
          printf '%s\n' "$NOTES" > notes.md
          gh release download "$TAG" -R "$RELEASE_REPO" -p "SkidSense-$VERSION-android-*.apk" -D apks
          (cd mobile && ./gradlew --no-daemon -q :tools:publish:installDist) > "$RUNNER_TEMP/publish-tool.log" 2>&1 || {
            echo "手机端的发布工具没有构建出来"; exit 1
          }
          mobile/tools/publish/build/install/publish/bin/publish index --version "$VERSION" \
            --notes-file notes.md --out "mobile.$CHANNEL.json" apks
          cat "mobile.$CHANNEL.json"

      - name: Say what is missing
        if: ${{ needs.ios.result != 'success' }}
        run: echo "::warning::iPhone 的 IPA 没有构建出来（${{ needs.ios.result }}），这个版本只发布 Android；重跑失败的 ios 任务可以补上"

      # Committed BEFORE the release becomes visible, as the desktop's index
      # is: if this fails the release stays a draft, and no phone is ever
      # told of a version whose page is not up — nor, the other way round,
      # told it is up to date while a finished release waits.
      - name: Commit the phone's index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          file="mobile.$CHANNEL.json"
          sha="$(gh api "repos/$RELEASE_REPO/contents/$file?ref=main" -q .sha 2>/dev/null || true)"
          gh api --method PUT "repos/$RELEASE_REPO/contents/$file" \
            -f message="index: $VERSION (mobile)" \
            -f content="$(base64 -w0 "$file")" \
            -f branch=main \
            ${sha:+-f sha="$sha"}
          echo "已提交 $file（$VERSION）"

      # Never the repository's latest (`--latest=false`: un-drafting a
      # release makes it latest unless told otherwise): that is the desktop's
      # download page. A beta stays a pre-release. Both read back.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$CHANNEL" = beta ]; then
            gh release edit "$TAG" -R "$RELEASE_REPO" --draft=false
            want="true	false"
          else
            gh release edit "$TAG" -R "$RELEASE_REPO" --draft=false --latest=false
            want="false	false"
          fi
          state="$(gh api "repos/$RELEASE_REPO/releases/tags/$TAG" -q '[.prerelease, .draft] | @tsv')"
          echo "发布状态（prerelease, draft）：$state"
          [ "$state" = "$want" ] || { echo "$CHANNEL 没有按预期发布（应为 $want）"; exit 1; }
          latest="$(gh api "repos/$RELEASE_REPO/releases/latest" -q .tag_name 2>/dev/null || true)"
          echo "仓库的 latest：${latest:-（没有）}"
          case "$latest" in
            mobile-*) echo "手机版成了仓库的 latest，桌面端的下载页会指错"; exit 1 ;;
          esac

      # The committed copy must describe this version: a commit that silently
      # failed leaves every phone reading a stale answer.
      - name: Confirm the phone's feed
        run: |
          index="https://raw.githubusercontent.com/$RELEASE_REPO/main/mobile.$CHANNEL.json"
          published="$(curl -s -L "$index" | jq -r '.version // empty' 2>/dev/null || true)"
          [ "$published" = "$VERSION" ] || { echo "✗ 仓库里的手机索引说 ${published:-（读不到）}，本应是 $VERSION：$index"; exit 1; }
          echo "✓ 手机索引已是 $VERSION：$index"
          echo "  缓存最多 5 分钟（raw 的 max-age=300）"

      # The hand-off APK and the sealed output of jobs that failed come off
      # once every job of the run has succeeded — not before: a re-run of a
      # failed job still needs the hand-off, and its seal still says why.
      - name: Take the hand-off files off the release
        if: ${{ needs.test.result == 'success' && needs.android.result == 'success' && needs.ios.result == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" -R "$RELEASE_REPO" --json assets -q '.assets[].name' \
            | { grep -E '^(buildlog|handoff)-' || true; } \
            | while read -r name; do
                gh release delete-asset "$TAG" "$name" -R "$RELEASE_REPO" --yes
                echo "已移除 $name"
              done
